[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "w4h-sql-compute-mets"
version = "0.1.0"
description = "Notebook + CLI to run YAML-bound SQL METs against one W4H dataset via the API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28",
  "python-dotenv>=1.0",
]

[project.scripts]
w4h-sql-compute-mets = "w4h_sql_compute_mets.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["w4h_sql_compute_mets*"]
